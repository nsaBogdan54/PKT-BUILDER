# Минимальный конфиг: одно устройство.
#
#   pkt-builder -c examples\minimal.yml -i out.pkt

model: 2911
name: HQswitch
pos: 200, 235
cfg: |
  hostname HQswitch
  enable secret class
  interface GigabitEthernet0/0
   ip address 10.0.0.1 255.255.255.0
   no shutdown
  line con 0
   password cisco
   login
  end
